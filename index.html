<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Concert Check-In</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 15px;
      background: white;
      font-size: 20px;
    }

    .success {
      background: #d9f7df !important;
      color: #146c2e;
    }

    .error {
      background: #ffe0e0 !important;
      color: #a40000;
    }

    .already {
      background: #fff0c2 !important;
      color: #805b00;
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin: 10px 0;
    }

    .code {
      font-size: 18px;
      color: #555;
    }

    .tickets {
      font-size: 22px;
      margin: 15px 0;
    }

    .time {
      font-size: 17px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<h1>🎟️ Concert Check-In</h1>

<p>Scan ticket QR code</p>

<div id="reader"></div>

<div id="result">
  Starting camera...
</div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbyKDcXR377boG9Lbc7gMUnIeSfO_w-qz8BF4hxLA5pJO9Mg_t89vCNU47HJF0btNb00Sw/exec";

let scanner = null;
let scanning = false;
let processing = false;


function startScanner() {

  scanner = new Html5Qrcode("reader");

  scanner.start(

    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      if (!scanning || processing) return;

      processing = true;
      scanning = false;

      processTicket(decodedText);
    },

    function(errorMessage) {
      // Ignore normal scanning errors.
    }

  )

  .then(function() {

    scanning = true;
    processing = false;

    document.getElementById("result").className = "";

    document.getElementById("result").innerHTML =
      "📷 Ready to scan";

  })

  .catch(function(error) {

    document.getElementById("result").className = "error";

    document.getElementById("result").innerHTML =

      "<div style='font-size:40px;'>📷</div>" +
      "<b>Camera access blocked</b><br><br>" +
      "Please allow camera access and reload this page.";
  });
}


async function processTicket(code) {

  document.getElementById("result").className = "";

  document.getElementById("result").innerHTML =
    "⏳ Checking ticket...";

  try {

    await scanner.stop();

  } catch (e) {}


  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify({
        code: code
      })

    });

    const data = await response.json();

    showResult(data);

  }

  catch (error) {

    document.getElementById("result").className =
      "error";

    document.getElementById("result").innerHTML =
      "❌ Connection error<br><br>" +
      error.message;

  }


  setTimeout(function() {

    document.getElementById("reader").innerHTML = "";

    startScanner();

  }, 2000);
}


function showResult(data) {

  const result =
    document.getElementById("result");


  if (data.success) {

    result.className = "success";

    let tickets = [];

    if (data.general > 0) {

      tickets.push(
        "General ×" + data.general
      );
    }

    if (data.student > 0) {

      tickets.push(
        "Student ×" + data.student
      );
    }


    result.innerHTML =

      "<div style='font-size:45px;'>✅</div>" +

      "<div style='font-size:25px;font-weight:bold;'>" +
      "CHECKED IN" +
      "</div>" +

      "<div class='name'>" +
      escapeHtml(data.name) +
      "</div>" +

      "<div class='code'>" +
      "Ticket: " +
      escapeHtml(data.code) +
      "</div>" +

      "<div class='tickets'>" +
      tickets.join(" | ") +
      "</div>" +

      "<div class='time'>" +
      data.time +
      "</div>";

  }


  else if (data.alreadyCheckedIn) {

    result.className = "already";

    result.innerHTML =

      "<div style='font-size:45px;'>⚠️</div>" +

      "<div style='font-size:25px;font-weight:bold;'>" +
      "ALREADY CHECKED IN" +
      "</div>" +

      "<div class='name'>" +
      escapeHtml(data.name) +
      "</div>" +

      "<div class='code'>" +
      "Ticket: " +
      escapeHtml(data.code) +
      "</div>" +

      "<div class='tickets'>" +
      "General ×" + data.general +
      " | Student ×" + data.student +
      "</div>" +

      "<div class='time'>" +
      "Checked in: " +
      data.time +
      "</div>";

  }


  else {

    result.className = "error";

    result.innerHTML =

      "<div style='font-size:45px;'>❌</div>" +

      "<div style='font-size:25px;font-weight:bold;'>" +
      "TICKET NOT FOUND" +
      "</div>" +

      "<div class='code'>" +
      escapeHtml(data.code || "") +
      "</div>";
  }
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


startScanner();

</script>

</body>
</html>
